[package]
name = "beetle"
version = "0.1.0"
edition = "2021"
authors = ["Beetles OS Team"]
description = "Beetles OS - AI agent os designed for edge hardware and embedded devices "
license = "MIT OR Apache-2.0"
repository = "https://github.com/Openbeetles/beetles"

[package.metadata.esp-idf-sys]
# Keep metadata at the common entry only. esp-idf-sys will auto-discover
# `sdkconfig.defaults.<mcu>`, while build.sh/build.ps1 can override with an
# explicit board overlay via `ESP_IDF_SDKCONFIG_DEFAULTS`.
esp_idf_sdkconfig_defaults = ["sdkconfig.defaults"]
# esp-idf-sys 默认 v5.2.3；升级到 6.0 以匹配当前 ESP 平台栈与本地组件集成。
esp_idf_version = "v6.0"

[[package.metadata.esp-idf-sys.extra_components]]
# Keep local C components such as `beetle_wss`; WakeNet/json wrappers were removed.
component_dirs = ["components"]

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(esp_idf_version_at_least_6_0_0)']

[build-dependencies]
# `espidf` feature exposes `embuild::espidf` used when building for ESP targets.
embuild = { version = "0.33.1", features = ["espidf"] }

[dependencies]
embedded-io = "0.7"
embedded-graphics-core = "0.4"
embedded-graphics = "0.8"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
# QQ 频道 Ed25519 验签；仅在 qq_channel 编译面打开时引入。
ed25519-dalek = { version = "2.1", optional = true, default-features = false, features = [
    "std",
] }
hex = "0.4"
getrandom = "0.2"
indexmap = "2.0"
base64 = "0.22"
aes = "0.8"
cbc = "0.1"
hmac = "0.12"
sha2 = "0.10"
urlencoding = "2.1"
regex = { version = "1.11", default-features = false, features = ["std"] }

[target.'cfg(any(target_arch = "xtensa", target_arch = "riscv32"))'.dependencies]
embedded-svc = "0.29"
esp-idf-hal = "0.46.2"
esp-idf-svc = "0.52.1"

[target.'cfg(not(any(target_arch = "xtensa", target_arch = "riscv32")))'.dependencies]
libc = "0.2"
env_logger = "0.11"
pdf-extract = "0.10"
mlua = { version = "0.10", features = ["lua54", "vendored", "serialize"] }
tokio = { version = "1", default-features = false, features = [
    "rt",
    "macros",
    "net",
    "time",
    "sync",
] }
futures = "0.3"
# CLI 系统（仅 Linux）
clap = { version = "4.5", features = ["derive", "cargo"] }
# Step 7.2：Linux 配置 API（同步 HTTP，无 tokio）
tiny_http = "0.12"
ureq = { version = "2.12", default-features = false, features = [
    "tls",
    "gzip",
    "socks-proxy",
] }
# Linux WSS（飞书/QQ 长连接）：同步客户端，rustls + webpki 根；禁止 default-features 以免拉 tokio。
tungstenite = { version = "0.24", default-features = false, features = [
    "handshake",
    "rustls-tls-webpki-roots",
] }
rustls = "0.23"
rustls-pki-types = "1.14.0"
tokio-rustls = "0.26.4"
webpki-roots = "1.0.6"
lettre = { version = "0.11.19", default-features = false, features = [
    "builder",
    "smtp-transport",
    "rustls-tls",
] }
mail-parser = "0.11.2"
async-imap = { version = "0.11", default-features = false, features = [
    "runtime-tokio",
] }
quick-xml = "0.38"

# Linux embedded WiFi：rtnetlink 控制面（仅 target_os=linux 编译进图）
[target.'cfg(target_os = "linux")'.dependencies]
rtnetlink = "0.20"
rusqlite = { version = "0.37", features = ["bundled"] }
alsa = "0.9"
udev = "0.9"
gpio-cdev = "0.6"
# Linux framebuffer 显示：内存 DrawTarget + mmap 回写
embedded-graphics-framebuf = "0.5.0"
spidev = "0.6"

[features]
default = [
    "default_runtime",
    "telegram",
    "feishu",
    "wecom",
    "qq_channel",
    "capability_voice",
    "capability_vision",
    "capability_sensor",
]
default_runtime = [
    "config_api",
    "tools_diagnostics",
    "tools_network_extra",
    "thread_panic_catch",
]
capability_office = []
capability_voice = []
capability_vision = []
capability_sensor = []
config_api = []
qq_channel = ["dep:ed25519-dalek"]
telegram = []
feishu = [] # 通道核心功能；默认 cargo build 开启，ESP package profile 显式决定是否带入
dingtalk = []
wecom = []
websocket = []
cli = []
ota = []
tools_diagnostics = []
tools_network_extra = []
thread_panic_catch = []

[profile.release]
opt-level = 2
lto = true
debug = false
strip = true
codegen-units = 1
panic = "abort"

# ESP32 固件构建：优化大小而非速度（Flash 受限）
# 使用: cargo build --profile release-size --target xtensa-esp32s3-espidf
#      cargo build --profile release-size --target riscv32imafc-esp-espidf
[profile.release-size]
inherits = "release"
opt-level = "z"

[patch.crates-io]
esp-idf-svc = { path = "third_party/esp-idf-svc" }
esp-idf-sys = { git = "https://github.com/mh0pe/esp-idf-sys", branch = "esp-idf-v6-support" }
esp-idf-hal = { path = "third_party/esp-idf-hal" }
