[package]
name = "beetle"
version = "0.1.0"
edition = "2021"
authors = ["Beetle OS Team"]
description = "Beetle OS - AI agent OS designed for edge hardware and embedded devices"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Openbeetles/beetles"

[package.metadata.esp-idf-sys]
# Keep metadata at the common entry only. esp-idf-sys will auto-discover
# `sdkconfig.defaults.<mcu>`, while build.sh/build.ps1 can override with an
# explicit board overlay via `ESP_IDF_SDKCONFIG_DEFAULTS`.
esp_idf_sdkconfig_defaults = ["sdkconfig.defaults"]
# esp-idf-sys 默认 v5.2.3；升级到 6.0 以匹配当前 ESP 平台栈与本地组件集成。
esp_idf_version = "v6.0"
esp_idf_sys_root_crate = "beetle"

[[package.metadata.esp-idf-sys.extra_components]]
# Keep local C components such as `beetle_wss`.
component_dirs = ["components"]

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_lcd_ili9341", version = "2.0.2" }
bindings_header = "components/beetle_lcd_deps/bindings.h"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(esp_idf_version_at_least_6_0_0)']

[build-dependencies]
# `espidf` feature exposes `embuild::espidf` used when building for ESP targets.
embuild = { version = "0.33.1", features = ["espidf"] }

[dependencies]
embedded-io = "0.7"
embedded-graphics-core = "0.4"
embedded-graphics = "0.8"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
getrandom = "0.2"
indexmap = "2.0"
base64 = "0.22"
urlencoding = "2.1"
regex = { version = "1.11", default-features = false, features = ["std"] }

[target.'cfg(any(target_arch = "xtensa", target_arch = "riscv32"))'.dependencies]
embedded-svc = "0.29"
esp-idf-sys = { version = "0.37.1", default-features = false }
esp-idf-hal = "0.46.2"
esp-idf-svc = "0.52.1"

[target.'cfg(not(any(target_arch = "xtensa", target_arch = "riscv32")))'.dependencies]
libc = "0.2"
env_logger = "0.11"
pdf-extract = "0.10"
mlua = { version = "0.10", features = ["lua54", "vendored", "serialize"] }
tokio = { version = "1", default-features = false, features = [
    "rt",
    "macros",
    "net",
    "time",
    "sync",
] }
futures = "0.3"
# CLI 系统（仅 Linux）
clap = { version = "4.5", features = ["derive", "cargo"] }
# Step 7.2：Linux 配置 API（同步 HTTP，无 tokio）
tiny_http = "0.12"
ureq = { version = "2.12", default-features = false, features = [
    "tls",
    "gzip",
    "socks-proxy",
] }
# Linux WSS（飞书/QQ 长连接）：同步客户端，rustls + webpki 根；禁止 default-features 以免拉 tokio。
tungstenite = { version = "0.24", default-features = false, features = [
    "handshake",
    "rustls-tls-webpki-roots",
] }
rustls = "0.23"
rustls-pki-types = "1.14.0"
tokio-rustls = "0.26.4"
webpki-roots = "1.0.6"
lettre = { version = "0.11.19", default-features = false, features = [
    "builder",
    "smtp-transport",
    "rustls-tls",
] }
mail-parser = "0.11.2"
async-imap = { version = "0.11", default-features = false, features = [
    "runtime-tokio",
] }
quick-xml = "0.38"

# Linux embedded WiFi：rtnetlink 控制面（仅 target_os=linux 编译进图）
[target.'cfg(target_os = "linux")'.dependencies]
rtnetlink = "0.20"
rusqlite = { version = "0.37", features = ["bundled"] }
alsa = "0.9"
udev = "0.9"
gpio-cdev = "0.6"
# Linux framebuffer 显示：内存 DrawTarget + mmap 回写
embedded-graphics-framebuf = "0.5.0"
spidev = "0.6"

[package.metadata.beetle.package_profiles.defaults]
esp = "voice+vision+sensor"
linux = "linux-full"

[package.metadata.beetle.package_profiles.profiles]
core-only = ["default_runtime"]
voice = ["default_runtime", "capability_voice"]
vision = ["default_runtime", "capability_vision"]
sensor = ["default_runtime", "capability_sensor"]
"voice+vision" = ["default_runtime", "capability_voice", "capability_vision"]
"voice+sensor" = ["default_runtime", "capability_voice", "capability_sensor"]
"vision+sensor" = ["default_runtime", "capability_vision", "capability_sensor"]
"voice+vision+sensor" = [
    "default_runtime",
    "capability_voice",
    "capability_vision",
    "capability_sensor",
    "qq_channel",
]
linux-full = ["default", "capability_office", "dingtalk", "websocket"]

[features]
# Feature contract:
# - `default` is the host/developer default `cargo build`, not the default ESP package profile.
# - `build.sh` / `build.ps1` package-profile defaults and roots are resolved from
#   `[package.metadata.beetle.package_profiles]` through `scripts/expand_cargo_features.py`;
#   do not hand-maintain a second package-profile source in scripts.
# - Public usage guidance lives in `docs/zh-cn/package-profiles-and-features.md` and
#   `docs/en-us/package-profiles-and-features.md`.

# Runtime bundles
# `default` is the normal host/developer build: baseline runtime + default channels +
# baseline multimodal capability domains. Official Linux packages use
# `linux-full = default + capability_office + dingtalk + websocket`.
default = [
    "default_runtime",
    "telegram",
    "feishu",
    "wecom",
    "qq_channel",
    "capability_voice",
    "capability_vision",
    "capability_sensor",
]
# `default_runtime` is the baseline runtime bundle shared by build.sh package profiles.
# It intentionally does not imply any channel or office capability.
default_runtime = [
    "config_api",
    "tools_diagnostics",
    "tools_network_extra",
    "thread_panic_catch",
]

# Capability domains
capability_office = []
capability_voice = []
capability_vision = []
capability_sensor = []

# Core runtime surfaces
# `config_api` is the user-facing device configuration/control plane.
config_api = []
# Additional runtime tool bundles carried by `default_runtime`.
tools_diagnostics = []
tools_network_extra = []
thread_panic_catch = []

# Channel surfaces
qq_channel = []
telegram = []
feishu = [] # 通道核心功能；默认 cargo build 开启，ESP package profile 显式决定是否带入
dingtalk = []
wecom = []
websocket = []

# Misc build toggles
cli = []

[profile.release]
opt-level = 2
lto = true
debug = false
strip = true
codegen-units = 1
panic = "abort"

# ESP32 固件构建：优化大小而非速度（Flash 受限）
# 使用: cargo build --profile release-size --target xtensa-esp32s3-espidf
#      cargo build --profile release-size --target riscv32imafc-esp-espidf
[profile.release-size]
inherits = "release"
opt-level = "z"
debug = true
strip = false

[patch.crates-io]
esp-idf-svc = { path = "third_party/esp-idf-svc" }
esp-idf-sys = { git = "https://github.com/mh0pe/esp-idf-sys", branch = "esp-idf-v6-support" }
esp-idf-hal = { path = "third_party/esp-idf-hal" }
