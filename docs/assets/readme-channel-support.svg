<svg width="1600" height="180" viewBox="0 0 1600 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Beetles OS channel support</title>
  <desc id="desc">A compact support strip for Telegram, Feishu, DingTalk, WeCom, QQ Channel, and WebSocket.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5FFFC"/>
      <stop offset=".55" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0F7FF"/>
    </linearGradient>
    <filter id="shadow" x="-16%" y="-40%" width="132%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0B5F76" flood-opacity=".08"/>
    </filter>
    <style>
      .tile { fill: rgba(255,255,255,.94); stroke: #CDEDEA; stroke-width: 2; }
      .name { fill: #183B38; font: 700 20px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .tag { fill: #6A817D; font: 600 12px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .markText { font: 800 20px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect width="1600" height="180" rx="34" fill="url(#bg)"/>
  <circle cx="1432" cy="12" r="104" fill="#D8F6EF" opacity=".34"/>
  <circle cx="92" cy="172" r="104" fill="#DDEFFF" opacity=".3"/>

  <g filter="url(#shadow)">
    <g transform="translate(86 58)">
      <rect class="tile" width="210" height="68" rx="22"/>
      <g transform="translate(20 17) scale(1.42)" fill="#26A5E4">
        <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
      </g>
      <text x="66" y="36" class="name">Telegram</text>
      <text x="66" y="53" class="tag">可选能力</text>
    </g>

    <g transform="translate(316 58)">
      <rect class="tile" width="210" height="68" rx="22"/>
      <rect x="20" y="17" width="34" height="34" rx="12" fill="#EEF6FF" stroke="#C8DCFF"/>
      <text x="27" y="41" class="markText" fill="#2563EB">飞</text>
      <text x="66" y="36" class="name">Feishu 飞书</text>
      <text x="66" y="53" class="tag">已支持</text>
    </g>

    <g transform="translate(546 58)">
      <rect class="tile" width="210" height="68" rx="22"/>
      <rect x="20" y="17" width="34" height="34" rx="12" fill="#EEF5FF" stroke="#BFDBFE"/>
      <text x="27" y="41" class="markText" fill="#1677FF">钉</text>
      <text x="66" y="36" class="name">DingTalk 钉钉</text>
      <text x="66" y="53" class="tag">已支持</text>
    </g>

