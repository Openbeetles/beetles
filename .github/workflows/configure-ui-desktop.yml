name: Configure UI Desktop

on:
  push:
    branches: [main, master]
    paths:
      - "configure-ui/**"
      - ".github/workflows/configure-ui-desktop.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "configure-ui/**"
      - ".github/workflows/configure-ui-desktop.yml"
  workflow_dispatch:

jobs:
  verify:
    name: Verify desktop shell baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: configure-ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        working-directory: configure-ui
        run: npm ci

      - name: Check Tauri version sync
        working-directory: configure-ui
        run: npm run tauri:sync-version:check

      - name: Run desktop base tests
        working-directory: configure-ui
        run: npm run test:desktop-base

      - name: Lint configure-ui
        working-directory: configure-ui
        run: npm run lint

      - name: Build configure-ui
        working-directory: configure-ui
        run: npm run build

      - name: Cargo check desktop shell
        run: cargo check --manifest-path configure-ui/src-tauri/Cargo.toml

  bundle:
    name: Bundle desktop shell (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            artifact_name: configure-ui-desktop-macos-debug
          - name: windows
            os: windows-latest
            artifact_name: configure-ui-desktop-windows-debug
          - name: linux
            os: ubuntu-22.04
            artifact_name: configure-ui-desktop-linux-debug
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: configure-ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop prerequisites
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        working-directory: configure-ui
        run: npm ci

      - name: Check Tauri version sync
        working-directory: configure-ui
        run: npm run tauri:sync-version:check

      - name: Build debug desktop bundle
        working-directory: configure-ui
        run: npm run tauri build -- --debug

      - name: Upload debug bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: configure-ui/src-tauri/target/debug/bundle
          if-no-files-found: error
