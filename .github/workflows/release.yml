# Step 8: tagged release — ESP32 + Linux musl binaries, SBOM, SHA256SUMS, build provenance.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build only; do not create GitHub Release'
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  RUST_BACKTRACE: 1

jobs:
  read-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          V=$(grep '^version' Cargo.toml | head -1 | sed -n 's/^version = "\([^"]*\)".*/\1/p')
          echo "version=$V" >> "$GITHUB_OUTPUT"

  build-configure-ui-desktop:
    name: Build Configure UI desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: read-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            artifact: configure-ui-desktop-macos
          - name: windows
            os: windows-latest
            artifact: configure-ui-desktop-windows
          - name: linux
            os: ubuntu-22.04
            artifact: configure-ui-desktop-linux
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: configure-ui/package-lock.json

      - name: Verify configure-ui version matches release version
        shell: bash
        run: |
          UI_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('configure-ui/package.json','utf8')).version)")
          if [ "$UI_VERSION" != "${{ needs.read-version.outputs.version }}" ]; then
            echo "configure-ui/package.json version $UI_VERSION must match release version ${{ needs.read-version.outputs.version }}"
            exit 1
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop prerequisites
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        working-directory: configure-ui
        run: npm ci

      - name: Check Tauri version sync
        working-directory: configure-ui
        run: npm run tauri:sync-version:check

      - name: Build desktop bundles
        working-directory: configure-ui
        run: npm run tauri build

      - name: Collect desktop artifacts (macOS)
        if: matrix.name == 'macos'
        shell: bash
        run: |
          mkdir -p _desktop_release
          find configure-ui/src-tauri/target/release/bundle -type f -name '*.dmg' -exec cp {} _desktop_release/ \;
          APP_PATH=$(find configure-ui/src-tauri/target/release/bundle/macos -maxdepth 1 -type d -name '*.app' | head -1)
          if [ -n "$APP_PATH" ]; then
            APP_NAME=$(basename "$APP_PATH")
            tar -C "$(dirname "$APP_PATH")" -czf "_desktop_release/${APP_NAME}.tar.gz" "$APP_NAME"
          fi
          ls -la _desktop_release

      - name: Collect desktop artifacts (Linux)
        if: matrix.name == 'linux'
        shell: bash
        run: |
          mkdir -p _desktop_release
          find configure-ui/src-tauri/target/release/bundle -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} _desktop_release/ \;
          ls -la _desktop_release

      - name: Collect desktop artifacts (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path _desktop_release | Out-Null
          Get-ChildItem -Path configure-ui/src-tauri/target/release/bundle -Recurse -File -Include *.msi,*.exe | ForEach-Object {
            Copy-Item $_.FullName -Destination _desktop_release
          }
          Get-ChildItem _desktop_release

      - name: Upload desktop artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: _desktop_release
          if-no-files-found: error

  build-esp:
    name: Build ESP32-S3 (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            features: ""
          - name: cli-ota
            features: "cli,ota"
    steps:
      - uses: actions/checkout@v4
      - name: Install Xtensa Rust toolchain
        uses: esp-rs/xtensa-toolchain@v1.5.2
        with:
          default: true
          targets: xtensa-esp32s3-espidf
      - name: Cache esp-idf and cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.espressif
            ~/.cargo/registry
            target
          key: esp-release-${{ matrix.name }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
      - name: Build release
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo build --release --target xtensa-esp32s3-espidf
          else
            cargo build --release --target xtensa-esp32s3-espidf --features "${{ matrix.features }}"
          fi
      - name: Upload firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-${{ matrix.name }}
          path: target/xtensa-esp32s3-espidf/release/beetle
          if-no-files-found: error

  build-linux-musl:
    name: Build Linux musl (zigbuild)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    strategy:
      matrix:
        include:
          - triple: armv7-unknown-linux-musleabihf
            artifact: linux-armv7
          - triple: riscv64gc-unknown-linux-musl
            artifact: linux-riscv64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - name: Install target
        run: rustup target add ${{ matrix.triple }}
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked
      - name: Cargo zigbuild release
        run: cargo-zigbuild build --release --target ${{ matrix.triple }}
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.triple }}/release/beetle
          if-no-files-found: error

  release:
    name: Package and publish
    needs: [read-version, build-configure-ui-desktop, build-esp, build-linux-musl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version label
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "label=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "label=v${{ needs.read-version.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag matches Cargo.toml
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "${{ needs.read-version.outputs.version }}" ]; then
            echo "Tag ${GITHUB_REF_NAME} (strip v: $TAG) must equal Cargo.toml version ${{ needs.read-version.outputs.version }}"
            exit 1
          fi

      - name: Download ESP artifacts
        uses: actions/download-artifact@v4
        with:
          name: esp32s3-default
          path: _artifacts/esp-default

      - name: Download ESP cli-ota artifacts
        uses: actions/download-artifact@v4
        with:
          name: esp32s3-cli-ota
          path: _artifacts/esp-cli-ota

      - name: Download Linux armv7
        uses: actions/download-artifact@v4
        with:
          name: linux-armv7
          path: _artifacts/linux-armv7

      - name: Download Linux riscv64
        uses: actions/download-artifact@v4
        with:
          name: linux-riscv64
          path: _artifacts/linux-riscv64

      - name: Download Configure UI desktop macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: configure-ui-desktop-macos
          path: _artifacts/configure-ui-desktop-macos

      - name: Download Configure UI desktop Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: configure-ui-desktop-windows
          path: _artifacts/configure-ui-desktop-windows

      - name: Download Configure UI desktop Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: configure-ui-desktop-linux
          path: _artifacts/configure-ui-desktop-linux

      - name: chmod +x downloaded binaries
        run: chmod +x _artifacts/esp-default/beetle _artifacts/esp-cli-ota/beetle _artifacts/linux-armv7/beetle _artifacts/linux-riscv64/beetle

      - name: Rename ESP binaries
        run: |
          LABEL="${{ steps.ver.outputs.label }}"
          mkdir -p _release
          cp _artifacts/esp-default/beetle "_release/beetle-${LABEL}-esp32s3.bin"
          cp _artifacts/esp-cli-ota/beetle "_release/beetle-${LABEL}-esp32s3-cli-ota.bin"

      - name: Package Linux tarballs
        run: |
          bash scripts/package_linux_release.sh \
            --version "${{ steps.ver.outputs.label }}" \
            --armv7 _artifacts/linux-armv7/beetle \
            --riscv64 _artifacts/linux-riscv64/beetle \
            --output-dir _release

      - name: Collect Configure UI desktop release artifacts
        run: |
          find _artifacts/configure-ui-desktop-macos -maxdepth 1 -type f -exec cp {} _release/ \;
          find _artifacts/configure-ui-desktop-windows -maxdepth 1 -type f -exec cp {} _release/ \;
          find _artifacts/configure-ui-desktop-linux -maxdepth 1 -type f -exec cp {} _release/ \;
          ls -la _release

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Generate CycloneDX SBOM (JSON)
        run: |
          LABEL="${{ steps.ver.outputs.label }}"
          cargo cyclonedx --format json
          if [ -f beetle.cdx.json ]; then SRC=beetle.cdx.json
          elif [ -f bom.json ]; then SRC=bom.json
          else echo "No SBOM output from cargo cyclonedx" >&2; ls -la; exit 1; fi
          mv "$SRC" "_release/beetle-${LABEL}-cyclonedx.json"
          ls -la _release

      - name: SHA256SUMS
        working-directory: _release
        run: |
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Attest release artifacts (binaries, tarballs, desktop bundles, SBOM; not SHA256SUMS)
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            ${{ github.workspace }}/_release/beetle-*
            ${{ github.workspace }}/_release/Beetle*

      - name: Upload release bundle (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-${{ steps.ver.outputs.label }}
          path: _release

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: _release/*
          generate_release_notes: true
